<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://mcgmpxrpdhjpmvtbxfmj.supabase.co; img-src 'self' blob: data:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>文件工作台｜旋賞數位</title>
<link rel="stylesheet" href="./app.css"><script type="module" src="./app.js"></script>
</head>
<body>
<header><a class="brand" href="./"><img src="./brand.png" alt="Hey Cheng 旋賞數位"></a><div id="identity" hidden><span id="identity-text"></span><button id="logout" class="quiet">登出</button></div></header>
<main>
<section id="login-panel" class="login-panel"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>你的文件，<br>在同一個地方。</h1><p>使用已獲授權的 Google 帳號登入，查看你的文件。</p><button id="login" disabled>使用 Google 登入</button><p id="setup-message" class="muted">正在確認工作台設定…</p></section>
<section id="workspace" hidden>
<div class="heading"><div><p class="eyebrow">YOUR WORKSPACE</p><h1>文件工作台</h1></div><button id="refresh" class="quiet">重新整理</button></div>
<nav aria-label="工作台"><button id="documents-tab" aria-current="page">文件</button><button id="admin-tab" hidden>帳號與權限</button></nav>
<section id="documents-panel"><div id="document-list" class="documents"></div><p id="empty-documents" hidden>目前沒有可查看的文件。</p>
<section id="upload-panel" class="panel" hidden><h2>新增文件</h2><p class="muted">PDF、PNG、JPEG 或 WebP，每份最多 10 MiB。</p><form id="upload-form"><label>文件名稱<input name="title" maxlength="160" required></label><label>檔案<input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" required></label><label>開放方式<select name="scope"><option value="assigned">只限逐件指定的帳號</option value="internal">內部共用（管理者與同事）</option></select></label><button type="submit">上傳文件</button></form></section>
</section>
<section id="admin-panel" hidden><section class="panel"><h2>新增 Google 帳號</h2><p class="muted">加入後即可使用該 Gmail 登入。這項操作不會寄送邀請信。</p><form id="member-form"><label>Gmail<input type="email" name="email" required maxlength="254" autocomplete="off" placeholder="name@gmail.com"></label><label>角色<select name="role"><option value="staff">同事</option><option value="client">客戶</option></select></label><button type="submit">加入帳號</button></form></section><section class="panel"><h2>帳號管理</h2><div id="member-list"></div></section><section class="panel"><h2>最近權限異動</h2><div id="audit-list"></div></section></section>
</section>
<p id="notice" role="status" aria-live="polite"></p>
</main>
<dialog id="viewer"><div class="dialog-heading"><h2 id="viewer-title"></h2><button id="close-viewer" class="quiet">關閉</button></div><div id="viewer-external" class="panel" role="status" hidden></div><div id="viewer-body"></div><button id="viewer-download">下載檔案</button></dialog>
<dialog id="permissions"><div class="dialog-heading"><h2 id="permissions-title">文件權限</h2><button id="close-permissions" class="quiet">關閉</button></div><p id="permissions-note"></p><div id="permissions-list"></div></dialog>
<footer>旋賞數位有限公司 · 私人文件工作台</footer>
</body></html>
