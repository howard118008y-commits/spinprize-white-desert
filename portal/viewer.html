<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'"><title>內部文件</title></head><body><p>正在開啟文件…</p><script>
// This shell always runs in an opaque sandbox. It never receives auth tokens.
// Only the parent may send one already-authorized, trusted internal HTML document.
function render(event) {
  if (event.source !== parent || event.data?.type !== 'portal-render' || typeof event.data.html !== 'string' || event.data.html.length > 14000000) return;
  window.removeEventListener('message', render);
  document.open(); document.write(event.data.html); document.close();
  function layout(preference){
    if(!['auto','desktop','mobile'].includes(preference))return;
    document.documentElement.dataset.viewPreference=preference;
    if(preference==='auto')delete document.documentElement.dataset.view;else document.documentElement.dataset.view=preference;
  }
  layout(event.data.preference);
  window.addEventListener('message',event=>{
    if(event.source!==parent || !event.data || Object.keys(event.data).sort().join(',')!=='preference,type' || event.data.type!=='portal-layout')return;
    layout(event.data.preference);
  });
  document.addEventListener('click', click => {
    const anchor = click.target.closest?.('a[data-portal-external]');
    if (!anchor) return;
    click.preventDefault(); click.stopImmediatePropagation();
    parent.postMessage({type:'portal-external-link',id:anchor.getAttribute('data-portal-external')}, '*');
  }, true);
}
window.addEventListener('message', render);
</script></body></html>
